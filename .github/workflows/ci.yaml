name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test local and minio adapter on node ${{matrix.node-version}}
    strategy:
      matrix:
        node-version: ["24.x"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{matrix.node-version}}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules
          key: node-modules-cache-${{matrix.node-version}}-${{runner.os}}-${{hashFiles('package-lock.json')}}-${{github.ref}}
          restore-keys: |
            node-modules-cache-${{matrix.node-version}}-${{runner.os}}-${{hashFiles('package-lock.json')}}-
            node-modules-cache-${{matrix.node-version}}-${{runner.os}}-
      - run: npm ci
      - run: npm run test-local
      - run: npm run test-minio
